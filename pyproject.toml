[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudlens-ai"
version = "0.1.0"
description = "Agentic banking fraud investigation platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyspark>=3.5.0",
  "databricks-sql-connector>=3.0.0",
  "databricks-sdk>=0.30.0",
  "streamlit>=1.36.0",
  "plotly>=5.22.0",
  "faker>=30.0.0",
  "pyarrow>=16.0.0",
  "pytest>=8.0.0",
  "python-dotenv>=1.0.0",
  "PyYAML>=6.0.0",
  "openai>=1.40.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["data_generator", "src"]
